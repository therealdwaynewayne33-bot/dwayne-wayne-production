openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DreamFrame AI Studio API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: characters
    description: Character library operations
  - name: projects
    description: Project operations
  - name: videos
    description: Video generation operations
  - name: dashboard
    description: Dashboard summary operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logoutUser
      tags: [auth]
      summary: Logout user
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /characters:
    get:
      operationId: listCharacters
      tags: [characters]
      summary: List all characters for the current user
      responses:
        "200":
          description: List of characters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Character"
    post:
      operationId: createCharacter
      tags: [characters]
      summary: Create a new character
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCharacterBody"
      responses:
        "201":
          description: Character created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"

  /characters/{id}:
    get:
      operationId: getCharacter
      tags: [characters]
      summary: Get a character by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Character found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteCharacter
      tags: [characters]
      summary: Delete a character
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects for the current user
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectBody"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /videos:
    get:
      operationId: listVideos
      tags: [videos]
      summary: List videos for the current user
      parameters:
        - name: projectId
          in: query
          schema:
            type: integer
          description: Filter by project
      responses:
        "200":
          description: List of videos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Video"
    post:
      operationId: generateVideo
      tags: [videos]
      summary: Generate a new video
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateVideoBody"
      responses:
        "201":
          description: Video generation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"

  /videos/{id}:
    get:
      operationId: getVideo
      tags: [videos]
      summary: Get a video by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Video found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteVideo
      tags: [videos]
      summary: Delete a video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /videos/{id}/apply-style:
    post:
      operationId: applyStyle
      tags: [videos]
      summary: Apply a visual style to a video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyStyleBody"
      responses:
        "200":
          description: Style applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"

  /videos/upload-character:
    post:
      operationId: uploadCharacterImage
      tags: [videos]
      summary: Upload a character image for face-lock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadCharacterImageBody"
      responses:
        "200":
          description: Character image uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadCharacterImageResponse"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent user activity feed
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/style-breakdown:
    get:
      operationId: getStyleBreakdown
      tags: [dashboard]
      summary: Get breakdown of videos by style
      responses:
        "200":
          description: Style breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StyleCount"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        plan:
          type: string
          enum: [free, pro, enterprise]
        createdAt:
          type: string
          format: date-time
      required: [id, email, name, plan, createdAt]

    RegisterBody:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        password:
          type: string
          minLength: 8
      required: [email, name, password]

    LoginBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
      required: [user, token]

    Character:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        name:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        thumbnailUrl:
          type: string
        videoCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, userId, name, imageUrl, videoCount, createdAt]

    CreateCharacterBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        imageUrl:
          type: string
      required: [name, imageUrl]

    Project:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [draft, processing, completed, failed]
        videoCount:
          type: integer
        thumbnailUrl:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, userId, title, status, videoCount, createdAt, updatedAt]

    CreateProjectBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
      required: [title]

    UpdateProjectBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [draft, processing, completed, failed]

    Video:
      type: object
      properties:
        id:
          type: integer
        projectId:
          type: integer
        userId:
          type: integer
        title:
          type: string
        prompt:
          type: string
        generationType:
          type: string
          enum: [text-to-video, image-to-video]
        style:
          type: string
          enum: [realistic, cartoon, animated-3d, cinematic]
        status:
          type: string
          enum: [queued, processing, completed, failed]
        videoUrl:
          type: string
        thumbnailUrl:
          type: string
        duration:
          type: number
        characterId:
          type: integer
        backgroundReplaced:
          type: boolean
        backgroundPrompt:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, projectId, userId, title, prompt, generationType, style, status, backgroundReplaced, createdAt]

    GenerateVideoBody:
      type: object
      properties:
        projectId:
          type: integer
        title:
          type: string
        prompt:
          type: string
        generationType:
          type: string
          enum: [text-to-video, image-to-video]
        style:
          type: string
          enum: [realistic, cartoon, animated-3d, cinematic]
        characterId:
          type: integer
        sourceImageUrl:
          type: string
        backgroundReplaced:
          type: boolean
        backgroundPrompt:
          type: string
      required: [projectId, title, prompt, generationType, style]

    ApplyStyleBody:
      type: object
      properties:
        style:
          type: string
          enum: [realistic, cartoon, animated-3d, cinematic]
      required: [style]

    UploadCharacterImageBody:
      type: object
      properties:
        name:
          type: string
        imageDataUrl:
          type: string
      required: [name, imageDataUrl]

    UploadCharacterImageResponse:
      type: object
      properties:
        imageUrl:
          type: string
        characterId:
          type: integer
      required: [imageUrl]

    DashboardSummary:
      type: object
      properties:
        totalProjects:
          type: integer
        totalVideos:
          type: integer
        totalCharacters:
          type: integer
        processingCount:
          type: integer
        completedCount:
          type: integer
        planLimit:
          type: integer
        planUsed:
          type: integer
      required: [totalProjects, totalVideos, totalCharacters, processingCount, completedCount, planLimit, planUsed]

    ActivityItem:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [video_generated, character_added, project_created, style_applied]
        description:
          type: string
        resourceId:
          type: integer
        resourceType:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, type, description, createdAt]

    StyleCount:
      type: object
      properties:
        style:
          type: string
        count:
          type: integer
      required: [style, count]
